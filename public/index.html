<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Isle</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>The Isle</h1>
      <p>A shared island. Click or tap anywhere to leave a small mark — it stays for everyone who visits next.</p>
    </header>

    <main>
      <div id="map" class="map">
        <img src="/assets/island.png" alt="A fictional island" class="map-image" draggable="false" />
        <div id="marks" class="marks-layer"></div>
      </div>
    </main>

    <div id="palette" class="palette" hidden>
      <button type="button" class="palette-choice" data-kind="flag">
        <img src="/assets/icons/flag.svg" alt="Flag" />
      </button>
      <button type="button" class="palette-choice" data-kind="campfire">
        <img src="/assets/icons/campfire.svg" alt="Campfire" />
      </button>
      <button type="button" class="palette-choice" data-kind="tent">
        <img src="/assets/icons/tent.svg" alt="Tent" />
      </button>
      <button type="button" class="palette-choice" data-kind="boat">
        <img src="/assets/icons/boat.svg" alt="Boat" />
      </button>
      <button type="button" class="palette-choice" data-kind="tree">
        <img src="/assets/icons/tree.svg" alt="Tree" />
      </button>
      <button type="button" class="palette-choice" data-kind="ruin">
        <img src="/assets/icons/ruin.svg" alt="Ruin" />
      </button>
    </div>

    <footer class="page-footer">
      <p>
        <a href="/world/">Shared terrain (C9 real-time prototype)</a> &middot;
        <a href="/readme/">What "good" means for this app</a> &middot;
        Island art by
        <a href="https://wisedawn.itch.io/" target="_blank" rel="noopener">Wisedawn</a>
        via
        <a href="https://opengameart.org/content/25-cc0-top-down-islands" target="_blank" rel="noopener"
          >OpenGameArt</a
        >
        (CC0) &middot; Icons by Lorc &amp; Delapouite via
        <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>
        (CC BY 3.0)
      </p>
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
